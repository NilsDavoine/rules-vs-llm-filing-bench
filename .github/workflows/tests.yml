name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # Fast tests only: rules, guard, parsing, and the Claude path with a fake client.
      # No torch, no model download, no key.
      - run: python -m pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
